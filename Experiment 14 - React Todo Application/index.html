<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React TODO Application</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background: #fff;">

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function TodoApp() {
    const [tasks, setTasks] = useState([
        { id: 1, text: "Complete Web Technologies Record", completed: false }
    ]);
    const [input, setInput] = useState("");

    const addTask = event => {
        event.preventDefault();
        const text = input.trim();
        if (!text) return;
        setTasks(current => [
            ...current,
            { id: Date.now(), text, completed: false }
        ]);
        setInput("");
    };

    const toggleTask = id => {
        setTasks(current => current.map(task =>
            task.id === id ? { ...task, completed: !task.completed } : task
        ));
    };

    const deleteTask = id => {
        setTasks(current => current.filter(task => task.id !== id));
    };

    return (
        <main style={{ maxWidth: 520, margin: "40px auto", padding: 20,
            fontFamily: "Arial", background: "#f8fafc", border: "1px solid #cbd5e1", borderRadius: 8 }}>
            <h1>React TODO Application</h1>
            <form onSubmit={addTask} style={{ display: "flex", gap: 8 }}>
                <input value={input}
                    onChange={event => setInput(event.target.value)}
                    placeholder="Enter a new task..."
                    aria-label="New task"
                    style={{ flex: 1, padding: 10 }} />
                <button type="submit" style={{ padding: "10px 16px", cursor: "pointer" }}>Add</button>
            </form>
            <ul style={{ listStyle: "none", padding: 0 }}>
                {tasks.map(task => (
                    <li key={task.id}
                        style={{ display: "flex", justifyContent: "space-between",
                            alignItems: "center", gap: 12, padding: 12,
                            borderBottom: "1px solid #cbd5e1" }}>
                        <button type="button" onClick={() => toggleTask(task.id)}
                            style={{ background: "none", border: 0, color: "#1e293b",
                                textDecoration: task.completed ? "line-through" : "none",
                                textAlign: "left", flex: 1, cursor: "pointer", fontSize: "16px" }}>
                            {task.text}
                        </button>
                        <button type="button" onClick={() => deleteTask(task.id)}
                            style={{ padding: "5px 10px", cursor: "pointer" }}>
                            Delete
                        </button>
                    </li>
                ))}
            </ul>
            <p>Total tasks: {tasks.length}</p>
            <p>Completed: {tasks.filter(task => task.completed).length}</p>
        </main>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TodoApp />);
</script>

</html>
