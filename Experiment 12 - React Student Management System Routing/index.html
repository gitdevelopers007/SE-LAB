<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
        .app { max-width: 900px; margin: 30px auto; padding: 0 18px; }
        header { background: #172554; color: white; padding: 20px; border-radius: 8px; }
        header h1 { margin: 0; }
        nav { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; }
        nav button { background: none; border: none; color: white; text-decoration: none; font-size: 16px; cursor: pointer; padding: 0; }
        nav button:hover { text-decoration: underline; }
        .panel { background: white; margin-top: 22px; padding: 24px; border-radius: 8px; }
        label { display: block; margin: 14px 0; }
        input { display: block; width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        button[type="submit"] { padding: 10px 18px; border: 0; background: #2563eb; color: white; cursor: pointer; margin-top: 10px; }
        p[role="status"] { font-weight: bold; color: #15803d; margin-top: 15px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function Register() {
    const [form, setForm] = useState({ name: "", rollNo: "", email: "" });
    const [message, setMessage] = useState("");

    const update = event => {
        setForm({ ...form, [event.target.name]: event.target.value });
    };

    const submit = event => {
        event.preventDefault();
        setMessage(`Registered student: ${form.name} (${form.rollNo})`);
        setForm({ name: "", rollNo: "", email: "" });
    };

    return (
        <section className="panel">
            <h2>Student Registration</h2>
            <form onSubmit={submit}>
                <label>Full Name
                    <input name="name" value={form.name} onChange={update} required />
                </label>
                <label>Roll Number
                    <input name="rollNo" value={form.rollNo} onChange={update} required />
                </label>
                <label>Email
                    <input name="email" type="email" value={form.email} onChange={update} required />
                </label>
                <button type="submit">Register</button>
            </form>
            <p role="status">{message}</p>
        </section>
    );
}

function Login() {
    const [email, setEmail] = useState("");
    const [password, setPassword] = useState("");
    const [message, setMessage] = useState("");

    const submit = event => {
        event.preventDefault();
        setMessage("Login form submitted successfully.");
    };

    return (
        <section className="panel">
            <h2>Student Login</h2>
            <form onSubmit={submit}>
                <label>Email
                    <input type="email" value={email} onChange={event => setEmail(event.target.value)} required />
                </label>
                <label>Password
                    <input type="password" value={password} onChange={event => setPassword(event.target.value)} required />
                </label>
                <button type="submit">Login</button>
            </form>
            <p role="status">{message}</p>
        </section>
    );
}

function About() {
    return (
        <section className="panel">
            <h2>About Student Management System</h2>
            <p>This portal demonstrates student registration, login and navigation.
            It can be extended to manage enrollment and academic records.</p>
        </section>
    );
}

function Contact() {
    return (
        <section className="panel">
            <h2>Contact Administration</h2>
            <p>Email: support@university.edu</p>
            <p>Phone: +91-40-23456789</p>
        </section>
    );
}

function App() {
    const [route, setRoute] = useState("register");

    return (
        <div className="app">
            <header>
                <h1>Student Portal</h1>
                <nav>
                    <button onClick={() => setRoute("register")}>Register</button>
                    <button onClick={() => setRoute("login")}>Login</button>
                    <button onClick={() => setRoute("about")}>About</button>
                    <button onClick={() => setRoute("contact")}>Contact</button>
                </nav>
            </header>
            <main>
                {route === "register" && <Register />}
                {route === "login" && <Login />}
                {route === "about" && <About />}
                {route === "contact" && <Contact />}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
