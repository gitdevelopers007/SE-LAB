<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 20px; }
        .box { background: white; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: navy; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: navy; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #000066; }
        .error { color: red; font-size: 14px; margin-top: -5px; margin-bottom: 8px; }
        .success { color: green; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .link { color: navy; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<!-- PAGE 1: REGISTRATION -->
<div id="registerBox" class="box">
    <h2>Registration</h2>
    <form id="regForm" onsubmit="validateRegister(event)">
        <input id="regName" placeholder="Full Name">
        <div id="regNameErr" class="error"></div>

        <input id="regEmail" placeholder="Email Address">
        <div id="regEmailErr" class="error"></div>

        <input id="regPass" type="password" placeholder="Password (min 6 chars)">
        <div id="regPassErr" class="error"></div>

        <button type="submit">Register</button>
        <p id="regMsg" class="success"></p>
    </form>
    <a class="link" onclick="showBox('login')">Already have an account? Login</a>
</div>

<!-- PAGE 2: LOGIN -->
<div id="loginBox" class="box" style="display: none;">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="validateLogin(event)">
        <input id="loginEmail" placeholder="Email Address">
        <div id="loginEmailErr" class="error"></div>

        <input id="loginPass" type="password" placeholder="Password">
        <div id="loginPassErr" class="error"></div>

        <button type="submit">Login</button>
        <p id="loginMsg" class="success"></p>
    </form>
    <a class="link" onclick="showBox('register')">Need an account? Register</a>
</div>

<!-- PAGE 3: WELCOME -->
<div id="homeBox" class="box" style="display: none; text-align: center;">
    <h2>Welcome!</h2>
    <p class="success">Client-side validation passed successfully!</p>
    <p>You are now logged into the Shopping Store.</p>
    <button onclick="showBox('login')" style="background: gray;">Logout</button>
</div>

<script src="script.js"></script>

<!--
================================================================================
HOW TO RUN EXPERIMENT 3 IN VS CODE:
1. In VS Code, right-click this file ("index.html") -> "Open with Live Server" (or double-click).
2. Test validation: Try submitting empty inputs or invalid email to see errors.
3. Enter valid inputs -> automatically validates and navigates to Login -> Home!
================================================================================
-->

</body>
</html>
