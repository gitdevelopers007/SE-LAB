<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1; }
        h1 { margin-top: 0; font-size: 24px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { margin-top: 15px; padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
        th { background: #f1f5f9; }
        .del-btn { background: #dc2626; padding: 4px 8px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Management</h1>
    
    <form id="studentForm">
        <label>Name</label>
        <input type="text" id="name" required placeholder="Enter student name">
        <label>Branch</label>
        <input type="text" id="branch" required placeholder="e.g. CSE or ECE">
        <label>CGPA</label>
        <input type="number" step="0.1" id="cgpa" min="0" max="10" required placeholder="e.g. 8.5">
        <button type="submit">Add Student</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>
</div>

<script>
    async function loadStudents() {
        const res = await fetch("/students");
        const data = await res.json();
        const tbody = document.getElementById("studentList");
        tbody.innerHTML = data.map(s => `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.branch}</td>
                <td>${s.cgpa}</td>
                <td><button class="del-btn" onclick="deleteStudent(${s.id})">Delete</button></td>
            </tr>
        `).join("");
    }

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const student = {
            name: document.getElementById("name").value.trim(),
            branch: document.getElementById("branch").value.trim(),
            cgpa: parseFloat(document.getElementById("cgpa").value)
        };
        await fetch("/students", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
        });
        document.getElementById("studentForm").reset();
        loadStudents();
    });

    async function deleteStudent(id) {
        await fetch("/students/" + id, { method: "DELETE" });
        loadStudents();
    }

    loadStudents();
</script>
</body>
</html>
