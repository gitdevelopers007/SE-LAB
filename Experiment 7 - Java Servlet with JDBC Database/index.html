<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Shopping Controller</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f8fafc; color: #1e293b; }
        .box { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 8px; border: 1px solid #cbd5e1; }
        h2 { margin-top: 0; color: #1e40af; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { margin-top: 18px; width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1d4ed8; }
        a { display: inline-block; margin-top: 15px; color: #2563eb; }
    </style>
</head>
<body>

<div class="box">
    <h2>Add New Product</h2>
    <form action="/ShoppingController" method="POST">
        <label>Product ID</label>
        <input type="number" name="id" placeholder="e.g. 103" required>

        <label>Product Name</label>
        <input type="text" name="name" placeholder="e.g. USB-C Hub" required>

        <label>Price ($)</label>
        <input type="number" step="0.01" name="price" placeholder="e.g. 39.00" required>

        <button type="submit">Add Product to Database (POST)</button>
    </form>
    <p><a href="/ShoppingController">View Product Catalog (GET)</a></p>
</div>

</body>
</html>
